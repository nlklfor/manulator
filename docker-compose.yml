services:
  backend:
    build: ./backend # use backend/Dockerfile
    ports:
      - "8000:8000" # local port : container port
    volumes:
      - ./backend:/app # share the code, so changes reload without rebuilding
    healthcheck:
      # Healthy if /api/health answers
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s # check every 10 seconds
      timeout: 5s # a slower check counts as failed
      retries: 5 # unhealthy after 5 failed checks in a row
      start_period: 15s # failures during startup don't count

  frontend:
    build: ./frontend # use frontend/Dockerfile
    ports:
      - "3000:3000" # local port : container port, without this the browser cannot reach it
    environment:
      # The browser calls the backend through the local port
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Makes file watching work on Windows
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app # share the code, so changes reload without rebuilding
      - /app/node_modules # but keep the container's own installed packages
      - /app/.next # and its own build cache
    healthcheck:
      # Healthy if the home page loads
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy # wait until the backend check passes
