[project]
name = "pylaia-test"
version = "0.1.0"
requires-python = ">=3.10, <3.11"
dependencies = [
    "huggingface-hub>=2.2.0",
    "pylaia==1.1.2",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pip>=26.2.1",
]

[tool.uv]
# torch 1.13.1 asks for its CUDA packages on every Linux, but they only exist for
# x86_64. Without this, Docker on Apple Silicon (Linux aarch64) can't install PyLaia.
override-dependencies = [
    "nvidia-cublas-cu11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
