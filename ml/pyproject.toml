[project]
name = "manulator-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "jiwer>=4.0.0",
    "kraken>=7.1.1",
]

[tool.uv]
# Kraken pins scipy<1.16, but those builds crash on macOS 27 
override-dependencies = ["scipy>=1.16"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
