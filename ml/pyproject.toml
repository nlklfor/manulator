[project]
name = "manulator-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.146.0",
    "jiwer>=4.0.0",
    "kraken>=7.1.1",
    "transformers>=5.12.1",
    "torch>=2.14.0",
    "torchvision>=0.29.1",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Kraken pins scipy<1.16, but those builds crash on macOS 27 
override-dependencies = ["scipy>=1.16"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]