name: CI

on:
  push:
    branches: [dev, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7 # download the repo code
      - uses: actions/setup-node@v7 # install Node.js
        with:
          node-version: 22
      - run: npm ci # install exact versions from package-lock.json
      - run: npm run lint # ESLint
      - run: npm run format:check # Prettier
      - run: npm run build # make sure the app compiles
