name: CI

on:
  push:
    branches: [dev, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7 # download the repo code
      - uses: actions/setup-node@v7 # install Node.js
        with:
          node-version: 22
      - run: npm ci # install exact versions from package-lock.json
      - run: npm run lint # ESLint
      - run: npm run format:check # Prettier
      - run: npm run build # make sure the app compiles
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # download the repo code

      - name: Set up python
        uses: actions/setup-python@v5 # install Python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff
        run: python -m ruff check . # lint

      - name: Check formatting with ruff
        run: python -m ruff format --check . # formatting

      - name: Run tests
        run: pytest # make sure all tests pass
